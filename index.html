<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contactos</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Gestor de Contactos</h1>
        <div class="contador-contactos">
            Total de contactos: <span id="totalContactos">0</span>
        </div>
    </header>

    <main>
        <!-- SECCIÓN: FORMULARIO DE REGISTRO (Solo para agregar) -->
        <section id="seccionFormulario">
            <h2>Registrar Nuevo Contacto</h2>
            <form id="formularioContacto">
                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
                    <span class="error-msg" id="error-nombre"></span>
                </div>
                <div class="campo-formulario">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="Ej: +506 8888-8888">
                    <span class="error-msg" id="error-telefono"></span>
                </div>
                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: correo@ejemplo.com">
                    <span class="error-msg" id="error-email"></span>
                </div>
                <div class="campo-formulario">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria">
                        <option value="">Selecciona una categoría...</option>
                        <option value="Familia">Familia</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <span class="error-msg" id="error-categoria"></span>
                </div>
                <div class="botones-formulario">
                    <button type="submit" id="btnSubmit">Agregar contacto</button>
                </div>
            </form>
        </section>

        <!-- SECCIÓN: LISTA DE CONTACTOS -->
        <section id="seccionLista">
            <h2>Lista de contactos</h2>
            <div class="barra-busqueda">
                <input type="text" id="inputBuscar" placeholder="Buscar por nombre...">
                <button type="button" id="btnFavoritos" class="btn-favoritos-filtro">Mostrar Favoritos</button>
                <button type="button" id="btnOrdenar" class="btn-ordenar">Ordenar A-Z</button>
            </div>
            <div id="listaContactos">
                <p>No hay contactos registrados.</p>
            </div>
        </section>
    </main>

    <!-- VENTANA MODAL PARA EDITAR (Oculta por defecto) -->
    <div id="modalEditar" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Contacto</h3>
                <button id="btnCerrarModal" class="btn-cerrar-modal">&times;</button>
            </div>
            <form id="formularioEditar">
                <input type="hidden" id="editarId">
                <div class="campo-formulario">
                    <label for="editarNombre">Nombre:</label>
                    <input type="text" id="editarNombre" required>
                </div>
                <div class="campo-formulario">
                    <label for="editarTelefono">Teléfono:</label>
                    <input type="tel" id="editarTelefono" required>
                </div>
                <div class="campo-formulario">
                    <label for="editarEmail">Correo Electrónico:</label>
                    <input type="email" id="editarEmail" required>
                </div>
                <div class="campo-formulario">
                    <label for="editarCategoria">Categoría:</label>
                    <select id="editarCategoria" required>
                        <option value="Familia">Familia</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                <span class="error-msg" id="error-editar"></span>
                <div class="botones-formulario">
                    <button type="submit" class="btn-submit-modal">Guardar Cambios</button>
                    <button type="button" id="btnCancelarEdicion" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
