<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contactos</title>
    
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <!-- ENCABEZADO PRINCIPAL -->
    <header>
        <h1>Gestor de Contactos</h1>
        <div class="contador-contactos">
            Total de contactos: <span id="totalContactos">0</span>
        </div>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- 
            ============================================
            SECCIÓN: FORMULARIO DE REGISTRO
            ============================================
        -->
        <section id="seccionFormulario">
            <h2>Registrar Nuevo Contacto</h2>
            
            <form id="formularioContacto">
                <!-- Campo: Nombre -->
                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" name="nombre" placeholder="Ej: Juan Pérez">
                    <span class="error-msg" id="error-nombre"></span>
                </div>

                <!-- Campo: Teléfono -->
                <div class="campo-formulario">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" name="telefono" placeholder="Ej: +506 8888-8888">
                    <span class="error-msg" id="error-telefono"></span>
                </div>

                <!-- Campo: Correo Electrónico -->
                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" name="email" placeholder="Ej: correo@ejemplo.com">
                    <span class="error-msg" id="error-email"></span>
                </div>

                <!-- Campo: Categoría -->
                <div class="campo-formulario">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria" name="categoria">
                        <option value="">Selecciona una categoría...</option>
                        <option value="Familia">Familia</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <span class="error-msg" id="error-categoria"></span>
                </div>

                <!-- Botones de envío y cancelación -->
                <div class="botones-formulario">
                    <button type="submit" id="btnSubmit">Agregar contacto</button>
                    <button type="button" id="btnCancelar" class="btn-cancelar" style="display: none;">Cancelar</button>
                </div>
            </form>
        </section>

        <!-- 
            ============================================
            SECCIÓN: LISTA DE CONTACTOS
            ============================================
        -->
        <section id="seccionLista">
            <h2>Lista de contactos</h2>

            <!-- BARRA DE BÚSQUEDA Y ORDENAR -->
            <div class="barra-busqueda">
                <input type="text" id="inputBuscar" placeholder="Buscar por nombre...">
                <button type="button" id="btnOrdenar" class="btn-ordenar">Ordenar A-Z</button>
            </div>

            <div id="listaContactos">
                <p>No hay contactos registrados.</p>
            </div>
        </section>
    </main>

    <script src="script.js"></script>
</body>
</html>
