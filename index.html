<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestor de Contactos</title>
    
    <!-- Enlace a la hoja de estilos externa -->
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="fondo-interactivo" aria-hidden="true">
        <span class="burbuja burbuja-1"></span>
        <span class="burbuja burbuja-2"></span>
        <span class="burbuja burbuja-3"></span>
    </div>
    <!-- ENCABEZADO PRINCIPAL -->
    <header>
        <h1>Gestor de Contactos</h1>
        <div class="contador-contactos">
            Total de contactos: <span id="totalContactos">0</span>
        </div>
        <button id="btnTema" class="btn-tema" type="button" aria-label="Activar modo oscuro">☾ Modo oscuro</button>
    </header>

    <!-- CONTENEDOR PRINCIPAL -->
    <main>
        <!-- 
            ============================================
            SECCIÓN: FORMULARIO DE REGISTRO (Solo para agregar)
            ============================================
        -->
        <section id="seccionFormulario">
            <h2>Registrar Nuevo Contacto</h2>
            
            <form id="formularioContacto">
                <!-- Campo: Nombre -->
                <div class="campo-formulario">
                    <label for="nombre">Nombre:</label>
                    <input type="text" id="nombre" placeholder="Ej: Juan Pérez">
                    <span class="error-msg" id="error-nombre"></span>
                </div>

                <!-- Campo: Teléfono -->
                <div class="campo-formulario">
                    <label for="telefono">Teléfono:</label>
                    <input type="tel" id="telefono" placeholder="Ej: +506 8888-8888">
                    <span class="error-msg" id="error-telefono"></span>
                </div>

                <!-- Campo: Correo Electrónico -->
                <div class="campo-formulario">
                    <label for="email">Correo Electrónico:</label>
                    <input type="email" id="email" placeholder="Ej: correo@ejemplo.com">
                    <span class="error-msg" id="error-email"></span>
                </div>

                <!-- Campo: Categoría -->
                <div class="campo-formulario">
                    <label for="categoria">Categoría:</label>
                    <select id="categoria">
                        <option value="">Selecciona una categoría...</option>
                        <option value="Familia">Familia</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Otros">Otros</option>
                    </select>
                    <span class="error-msg" id="error-categoria"></span>
                </div>

                <!-- Botón de envío -->
                <div class="botones-formulario">
                    <button type="submit" id="btnSubmit">Agregar contacto</button>
                </div>
            </form>
        </section>

        <!-- 
            ============================================
            SECCIÓN: LISTA DE CONTACTOS
            ============================================
        -->
        <section id="seccionLista">
            <h2>Lista de contactos</h2>

            <section class="estadisticas" aria-labelledby="tituloEstadisticas">
                <h3 id="tituloEstadisticas">Estadísticas</h3>
                <div class="resumen-estadisticas" aria-live="polite" aria-atomic="true">
                    <p>Total <strong id="estadisticaTotal">0</strong></p>
                    <p>Favoritos <strong id="estadisticaFavoritos">0</strong></p>
                </div>
                <ul id="estadisticasCategorias" class="estadisticas-categorias" aria-label="Contactos por categoría"></ul>
            </section>

            <!-- BARRA DE BÚSQUEDA Y FILTROS -->
            <div class="barra-busqueda">
                <label class="sr-only" for="inputBuscar">Buscar contacto por nombre</label>
                <input type="search" id="inputBuscar" placeholder="Buscar por nombre..." aria-controls="listaContactos">
                <button type="button" id="btnVerTodos" class="btn-ver-todos" aria-label="Mostrar todos los contactos">Ver Todos</button>
                <button type="button" id="btnFavoritos" class="btn-favoritos-filtro" aria-pressed="false">Mostrar Favoritos</button>
                <button type="button" id="btnOrdenar" class="btn-ordenar" aria-label="Ordenar contactos de A a Z">Ordenar A-Z</button>
            </div>

            <!-- CONTENEDOR DINÁMICO DE CONTACTOS -->
            <div id="listaContactos" role="list" aria-live="polite" aria-label="Contactos registrados">
                <!-- Mensaje temporal de estado vacío -->
                <p>No hay contactos registrados.</p>
            </div>
        </section>
    </main>

    <!-- 
        ============================================
        VENTANA MODAL PARA EDITAR (Oculta por defecto)
        ============================================
    -->
    <div id="modalEditar" class="modal-overlay">
        <div class="modal-content">
            <div class="modal-header">
                <h3>Editar Contacto</h3>
                <button id="btnCerrarModal" class="btn-cerrar-modal">&times;</button>
            </div>
            <form id="formularioEditar">
                <!-- ID oculto para saber qué contacto se está editando -->
                <input type="hidden" id="editarId">
                
                <div class="campo-formulario">
                    <label for="editarNombre">Nombre:</label>
                    <input type="text" id="editarNombre" required>
                </div>
                
                <div class="campo-formulario">
                    <label for="editarTelefono">Teléfono:</label>
                    <input type="tel" id="editarTelefono" placeholder="Ej: +506 8888-8888" required>
                </div>
                
                <div class="campo-formulario">
                    <label for="editarEmail">Correo Electrónico:</label>
                    <input type="email" id="editarEmail" required>
                </div>
                
                <div class="campo-formulario">
                    <label for="editarCategoria">Categoría:</label>
                    <select id="editarCategoria" required>
                        <option value="Familia">Familia</option>
                        <option value="Trabajo">Trabajo</option>
                        <option value="Amigos">Amigos</option>
                        <option value="Otros">Otros</option>
                    </select>
                </div>
                
                <!-- Zona de errores para la modal -->
                <span class="error-msg" id="error-editar"></span>
                
                <div class="botones-formulario">
                    <button type="submit" class="btn-submit-modal">Guardar Cambios</button>
                    <button type="button" id="btnCancelarEdicion" class="btn-cancelar">Cancelar</button>
                </div>
            </form>
        </div>
    </div>

    <!-- VENTANA MODAL PARA VER LOS DETALLES DEL CONTACTO -->
    <div id="modalVerContacto" class="modal-overlay" aria-hidden="true">
        <div class="modal-content modal-detalle" role="dialog" aria-modal="true" aria-labelledby="tituloDetalle">
            <div class="modal-header">
                <h3 id="tituloDetalle">Detalle del contacto</h3>
                <button id="btnCerrarDetalle" class="btn-cerrar-modal" type="button" aria-label="Cerrar">&times;</button>
            </div>
            <div id="detalleContacto" class="detalle-contacto"></div>
            <div class="botones-formulario">
                <button type="button" id="btnCerrarDetallePie" class="btn-cancelar">Cerrar</button>
            </div>
        </div>
    </div>

    <!-- VISTA DE LLAMADA SIMULADA -->
    <div id="modalLlamada" class="modal-overlay modal-llamada" aria-hidden="true">
        <div class="pantalla-llamada" role="dialog" aria-modal="true" aria-labelledby="nombreLlamada">
            <div id="avatarLlamada" class="avatar-llamada"></div>
            <p class="etiqueta-llamada">Llamando a</p>
            <h3 id="nombreLlamada"></h3>
            <p id="telefonoLlamada" class="telefono-llamada"></p>
            <p id="estadoLlamada" class="estado-llamada">Sonando<span></span></p>
            <button id="btnColgar" class="btn-colgar" type="button" aria-label="Colgar llamada" title="Colgar llamada">☎</button>
        </div>
    </div>

    <!-- Enlace al archivo JavaScript externo -->
    <script src="script.js"></script>
</body>
</html>
